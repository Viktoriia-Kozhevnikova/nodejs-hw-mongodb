tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: Update a contact's details in the database using the provided contact ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    description: Unique identifier of the contact to update.
    required: true
    schema:
      type: string
      example: '67689a4b5f04458a5d6f1982'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: Full name of the contact.
            type: string
            example: 'Jane Doe'
          email:
            description: Email address of the contact.
            type: string
            example: 'jane.doe@example.com'
          phoneNumber:
            description: Phone number of the contact.
            type: string
            example: '+380858200007'
          isFavourite:
            description: Indicates if the contact is marked as favourite.
            type: boolean
            example: true
            default: false
          contactType:
            description: Type of contact (work, personal, home).
            type: string
            enum: ['work', 'home', 'personal']
            example: 'home'
            default: 'personal'
          photo:
            description: Contact's photo.
            type: string
            format: binary
responses:
  '200':
    description: Successfully updated the contact.
    content:
      application/json:
        schema:
          $ref: ../../../components/schemas/contact.yaml
  '400':
    description: Invalid ID for updating the contact.
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
